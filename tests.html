<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-Помощник учителя</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body { background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .container { background: #1e293b; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 700px; }
  h1 { font-size: 28px; margin-bottom: 10px; color: #38bdf8; text-align: center; }
  p { font-size: 16px; color: #94a3b8; margin-bottom: 20px; text-align: center; line-height: 1.5; }
  
  #promo-section { text-align: center; }
  input[type="text"] { width: 100%; padding: 15px; border-radius: 10px; border: 2px solid #475569; background: #0f172a; color: #fff; font-size: 18px; text-align: center; text-transform: uppercase; outline: none; margin-bottom: 15px; }
  .btn-activate { background: #38bdf8; color: #000; padding: 15px; border-radius: 10px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
  #error-msg { color: #f87171; margin-top: 15px; font-weight: bold; display: none; }

  #app-section { display: none; }
  textarea { width: 100%; padding: 15px; border-radius: 10px; border: 2px solid #475569; background: #0f172a; color: #fff; font-size: 16px; height: 100px; resize: none; margin-bottom: 15px; outline: none; }
  .btn-gen { background: #10b981; color: #fff; padding: 15px; border-radius: 10px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
  .btn-gen:disabled { background: #64748b; cursor: not-allowed; }
  
  #result { margin-top: 20px; background: #0f172a; padding: 20px; border-radius: 10px; border: 1px solid #334155; display: none; white-space: pre-wrap; font-size: 15px; line-height: 1.6; }
  
  .action-btns { display: none; gap: 10px; margin-top: 15px; }
  .action-btns button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
  .btn-copy { background: #8b5cf6; color: #fff; }
  .btn-copy:hover { background: #7c3aed; }
  .btn-download { background: #f59e0b; color: #000; }
  .btn-download:hover { background: #d97706; }

  .badge { display: inline-block; background: #10b981; color: #000; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 20px; }
  #loading-text { display: none; color: #38bdf8; text-align: center; margin-top: 15px; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
  <div id="promo-section">
    <h1>AI-Помощник учителя</h1>
    <p>Введите ваш промокод доступа.</p>
    <input type="text" id="promo-input" placeholder="Промокод">
    <button class="btn-activate" onclick="checkPromo()">Войти</button>
    <div id="error-msg">Неверный промокод.</div>
  </div>

  <div id="app-section">
    <div style="text-align: center;"><div class="badge">PRO версия активна</div></div>
    <h1>Генератор плана урока</h1>
    <p>Введите тему и класс. Нейросеть составит план.</p>
    
    <textarea id="topic-input" placeholder="Например: Вторая мировая война, 9 класс"></textarea>
    <button id="gen-btn" class="btn-gen" onclick="generateLesson()">Составить план урока</button>
    <div id="loading-text">Нейросеть думает... ⏳</div>
    
    <div id="result"></div>
    
    <div class="action-btns" id="action-btns">
      <button class="btn-copy" onclick="copyText()">📋 Скопировать</button>
      <button class="btn-download" onclick="downloadWord()">📄 Скачать в Word</button>
    </div>
  </div>
</div>

<script>
  const validPromoCodes = ["GLEB2024", "FREE_TEACHER", "TEST100"];

  function checkPromo() {
    const input = document.getElementById('promo-input').value.toUpperCase().trim();
    if (validPromoCodes.includes(input)) {
      localStorage.setItem('hasAccess', 'true');
      showApp();
    } else {
      document.getElementById('error-msg').style.display = 'block';
    }
  }

  function showApp() {
    document.getElementById('promo-section').style.display = 'none';
    document.getElementById('app-section').style.display = 'block';
  }

  window.onload = function() {
    if (localStorage.getItem('hasAccess') === 'true') showApp();
  }

  async function generateLesson() {
    const topic = document.getElementById('topic-input').value;
    const resultDiv = document.getElementById('result');
    const actionBtns = document.getElementById('action-btns');
    const loading = document.getElementById('loading-text');
    const btn = document.getElementById('gen-btn');
    
    if (topic.length < 3) {
      alert("Напишите тему и класс подробнее!");
      return;
    }
    
    resultDiv.style.display = 'none';
    actionBtns.style.display = 'none';
    loading.style.display = 'block';
    btn.disabled = true;
    btn.textContent = "Генерация...";

    const prompt = encodeURIComponent("Составь очень подробный и развернутый план урока на тему: " + topic + ". Распиши цели, задачи, оборудование и ход урока.");
    
    // Умная система попыток: пробуем 3 раза
    let success = false;
    for (let i = 0; i < 3; i++) {
      try {
        const response = await fetch("https://text.pollinations.ai/" + prompt);
        if (response.ok) {
          const aiText = await response.text();
          resultDiv.style.display = 'block';
          resultDiv.innerHTML = aiText.replace(/\n/g, '<br>');
          window.generatedText = aiText;
          actionBtns.style.display = 'flex';
          success = true;
          break; // Успех! Выходим из цикла
        }
      } catch (error) {
        console.log("Попытка " + (i + 1) + " не удалась. Ждем 2 секунды...");
        // Если не вышло, ждем 2 секунды перед новой попыткой
        await new Promise(r => setTimeout(r, 2000)); 
      }
    }

    // Если все 3 попытки провалились
    if (!success) {
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = `<span style="color: #f87171;">Ошибка: Сервер временно перегружен. Подожди минуту и нажми кнопку еще раз.</span>`;
    }

    loading.style.display = 'none';
    btn.disabled = false;
    btn.textContent = "Составить план урока";
  }

  function copyText() {
    if (!window.generatedText) return;
    navigator.clipboard.writeText(window.generatedText).then(() => {
      const btn = document.querySelector('.btn-copy');
      const oldText = btn.textContent;
      btn.textContent = "✅ Скопировано!";
      setTimeout(() => { btn.textContent = oldText; }, 2000);
    });
  }

  function downloadWord() {
    if (!window.generatedText) return;
    const htmlContent = `
      <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
      <head><meta charset='utf-8'><title>План урока</title></head>
      <body style="font-family: Arial, sans-serif; font-size: 14px; line-height: 1.5;">
        ${window.generatedText.replace(/\n/g, '<br>')}
      </body>
      </html>
    `;
    const blob = new Blob([htmlContent], { type: 'application/msword' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'План_урока.doc';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
</script>
</body>
</html>
