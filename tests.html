<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-Генератор тестов</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body { background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  
  .container { background: #1e293b; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 600px; }
  h1 { font-size: 28px; margin-bottom: 10px; color: #38bdf8; text-align: center; }
  p { font-size: 16px; color: #94a3b8; margin-bottom: 20px; text-align: center; line-height: 1.5; }

  /* Экран ввода промокода */
  #promo-section { text-align: center; }
  input[type="text"] { width: 100%; padding: 15px; border-radius: 10px; border: 2px solid #475569; background: #0f172a; color: #fff; font-size: 18px; text-align: center; text-transform: uppercase; outline: none; margin-bottom: 15px; }
  input[type="text"]:focus { border-color: #38bdf8; }
  .btn-activate { background: #38bdf8; color: #000; padding: 15px; border-radius: 10px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
  .btn-activate:hover { background: #0ea5e9; }
  #error-msg { color: #f87171; margin-top: 15px; font-weight: bold; display: none; }

  /* Экран генератора */
  #app-section { display: none; }
  textarea { width: 100%; padding: 15px; border-radius: 10px; border: 2px solid #475569; background: #0f172a; color: #fff; font-size: 16px; height: 100px; resize: none; margin-bottom: 15px; outline: none; }
  textarea:focus { border-color: #38bdf8; }
  .btn-gen { background: #10b981; color: #fff; padding: 15px; border-radius: 10px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
  .btn-gen:hover { background: #059669; }
  
  #result { margin-top: 20px; background: #0f172a; padding: 20px; border-radius: 10px; border: 1px solid #334155; display: none; white-space: pre-wrap; font-size: 15px; line-height: 1.6; }
  
  .badge { display: inline-block; background: #10b981; color: #000; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 20px; }
  #loading-text { display: none; color: #38bdf8; text-align: center; margin-top: 15px; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
  
  <!-- ЭКРАН 1: ВВОД ПРОМОКОДА -->
  <div id="promo-section">
    <h1>AI-Генератор тестов</h1>
    <p>Введите ваш промокод доступа, чтобы открыть Pro-версию.</p>
    
    <input type="text" id="promo-input" placeholder="Ваш промокод">
    <button class="btn-activate" onclick="checkPromo()">Войти</button>
    <div id="error-msg">Неверный промокод. Проверьте написание.</div>
  </div>

  <!-- ЭКРАН 2: ГЕНЕРАТОР -->
  <div id="app-section">
    <div style="text-align: center;"><div class="badge">PRO версия активна</div></div>
    <h1>Новый тест</h1>
    <p>Введите тему, и нейросеть составит вопросы.</p>
    
    <textarea id="topic-input" placeholder="Например: Строение клетки, биология 6 класс"></textarea>
    <button class="btn-gen" onclick="generateTest()">Сгенерировать тест</button>
    <div id="loading-text">Нейросеть думает... ⏳</div>
    
    <div id="result"></div>
  </div>

</div>

<script>
  // --- СПИСОК ПРОМОКОДОВ ---
  const validPromoCodes = [
    "GLEB2024",
    "FREE_TEACHER",
    "TEST100"
  ];

  // --- ПРОВЕРКА ПРОМОКОДА ---
  function checkPromo() {
    const input = document.getElementById('promo-input').value.toUpperCase().trim();
    const errorMsg = document.getElementById('error-msg');
    
    if (validPromoCodes.includes(input)) {
      localStorage.setItem('hasAccess', 'true'); // Запоминаем, что доступ получен
      showApp(); // Показываем генератор
    } else {
      errorMsg.style.display = 'block';
    }
  }

  // --- ПОКАЗ ГЕНЕРАТОРА ---
  function showApp() {
    document.getElementById('promo-section').style.display = 'none';
    document.getElementById('app-section').style.display = 'block';
  }

  // Проверяем доступ при загрузке страницы
  window.onload = function() {
    if (localStorage.getItem('hasAccess') === 'true') {
      showApp();
    }
  }

  // --- ИМИТАЦИЯ НЕЙРОСЕТИ ---
  function generateTest() {
    const topic = document.getElementById('topic-input').value;
    const resultDiv = document.getElementById('result');
    const loading = document.getElementById('loading-text');
    
    if (topic.length < 3) {
      alert("Напишите тему подробнее!");
      return;
    }
    
    resultDiv.style.display = 'none';
    loading.style.display = 'block';

    // Имитируем задержку нейросети (2 секунды)
    setTimeout(() => {
      loading.style.display = 'none';
      resultDiv.style.display = 'block';
      
      resultDiv.innerHTML = `<b>Тест по теме: "${topic}"</b><br><br>
      <b>1.</b> Какой главный признак этой темы?<br>
      А) Первый вариант<br>
      Б) Второй вариант<br>
      В) Правильный ответ<br><br>
      
      <b>2.</b> Выберите верное утверждение:<br>
      А) Это ложь<br>
      Б) Это правда<br>
      В) Здесь нет правильного ответа<br><br>
      
      <i>(В будущем здесь появится настоящий сгенерированный тест с вопросами и ответами)</i>`;
    }, 2000);
  }
</script>
</body>
</html>
