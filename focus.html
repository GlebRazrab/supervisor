<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Умный Фокус (Камера)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body { background: #000; color: #fff; overflow: hidden; height: 100vh; }
  
  /* Видео на фоне */
  #video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.4; z-index: 1; }
  #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); z-index: 2; pointer-events: none; }
  
  /* Интерфейс поверх видео */
  #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  
  /* Кнопка "На главную" */
  #back-btn { position: absolute; top: 20px; right: 20px; color: #4ade80; text-decoration: none; font-weight: bold; font-size: 16px; z-index: 20; background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px; transition: 0.3s; }
  #back-btn:hover { background: rgba(0,0,0,0.9); }

  /* Статус и счетчик */
  #status { position: absolute; top: 20px; left: 20px; font-size: 22px; font-weight: bold; color: #4ade80; text-shadow: 1px 1px 4px #000; background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 8px; }
  #status.bad { color: #f87171; }
  
  #counter { position: absolute; top: 80px; left: 20px; font-size: 18px; font-weight: bold; text-shadow: 1px 1px 4px #000; background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 8px; }

  /* Кнопки управления */
  .btn { border: none; border-radius: 30px; padding: 18px 50px; font-size: 22px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 6px 20px rgba(0,0,0,0.6); margin: 10px; }
  #startBtn { background: #4ade80; color: #000; }
  #startBtn:hover { transform: scale(1.05); background: #22c55e; }
  #stopBtn { background: #f87171; color: #000; display: none; }
  #stopBtn:hover { transform: scale(1.05); background: #ef4444; }
  
  /* Загрузка */
  #loading { position: absolute; z-index: 20; background: rgba(0,0,0,0.9); width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 20px; text-align: center; padding: 20px; font-weight: bold; color: #38bdf8; }
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="ui">
  <a href="index.html" id="back-btn">← На главную</a>
  
  <div id="status">Камера выключена</div>
  <div id="counter">Отвлечений: 0</div>
  
  <button id="startBtn" class="btn">Включить слежку</button>
  <button id="stopBtn" class="btn">Остановить</button>
</div>

<div id="loading">Загрузка нейросети...<br>Пожалуйста, подожди</div>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12";

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const counterEl = document.getElementById('counter');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const loadingEl = document.getElementById('loading');

let faceLandmarker;
let isRunning = false;
let distractions = 0;
let awaySince = null;
let counted = false;

// Озвучка
function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU';
  u.rate = 1.05;
  speechSynthesis.speak(u);
}

// Загрузка модели
async function loadModel() {
  const fileset = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/wasm');
  faceLandmarker = await FaceLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate: 'GPU' },
    runningMode: 'VIDEO', numFaces: 1
  });
}

// Проверка поворота головы
function headTurned(lm) {
  const nose = lm[1], lCheek = lm[234], rCheek = lm[454];
  const dl = Math.hypot(nose.x - lCheek.x, nose.y - lCheek.y);
  const dr = Math.hypot(nose.x - rCheek.x, nose.y - rCheek.y);
  const ratio = dl / dr;
  return ratio < 0.65 || ratio > 1 / 0.65;
}

// Главный цикл
function loop() {
  if (!isRunning) return;

  if (video.readyState >= 2) {
    canvas.width = video.videoWidth; 
    canvas.height = video.videoHeight;
    
    const res = faceLandmarker.detectForVideo(video, performance.now());
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    let distracted = false;
    if (res.faceLandmarks.length) {
      const lm = res.faceLandmarks[0];
      distracted = headTurned(lm);
      
      // Рисуем точку на носу (зеленую или красную)
      ctx.beginPath(); 
      ctx.arc(lm[1].x * canvas.width, lm[1].y * canvas.height, 10, 0, Math.PI*2);
      ctx.fillStyle = distracted ? '#f87171' : '#4ade80'; 
      ctx.fill();
    } else { 
      distracted = true; // Лица нет в кадре
    }

    const now = performance.now() / 1000;
    
    if (distracted) {
      if (awaySince === null) { 
        awaySince = now; 
        counted = false; 
      } else if (now - awaySince > 3 && !counted) { // 3 секунды отвлечения
        distractions++;
        counterEl.textContent = `Отвлечений: ${distractions}`;
        counted = true;
        speak('Вернись к урокам');
      }
    } else { 
      awaySince = null; 
      counted = false; 
    }

    statusEl.textContent = distracted ? 'ОТВЛЁКСЯ' : 'В ФОКУСЕ';
    statusEl.className = distracted ? 'bad' : '';
  }

  requestAnimationFrame(loop);
}

// Кнопка Старт
startBtn.addEventListener('click', async () => {
  startBtn.textContent = 'Загрузка...';
  startBtn.disabled = true;
  
  try {
    // Включаем камеру
    if (!video.srcObject) {
      video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
      await video.play();
    }
    // Загружаем нейросеть (если еще не загружена)
    if (!faceLandmarker) {
      await loadModel();
    }
    
    loadingEl.style.display = 'none';
    startBtn.style.display = 'none';
    stopBtn.style.display = 'block';
    
    isRunning = true;
    distractions = 0;
    counterEl.textContent = `Отвлечений: 0`;
    speak('Слежка включена. Сосредоточься.');
    
    loop(); // Запускаем цикл
    
  } catch (e) {
    alert('Ошибка камеры: ' + e.message);
    startBtn.textContent = 'Включить слежку';
    startBtn.disabled = false;
  }
});

// Кнопка Стоп
stopBtn.addEventListener('click', () => {
  isRunning = false;
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  stopBtn.style.display = 'none';
  startBtn.style.display = 'block';
  startBtn.textContent = 'Включить слежку';
  startBtn.disabled = false;
  
  statusEl.textContent = 'Камера выключена';
  statusEl.className = '';
  
  speak(`Слежка остановлена. Ты отвлекался ${distractions} раз.`);
});
</script>
</body>
</html>
